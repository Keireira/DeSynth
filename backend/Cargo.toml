[workspace]
members = ["crates/*"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
desynth-core = { path = "crates/core" }
desynth-images = { path = "crates/images" }
desynth-inference = { path = "crates/inference" }
desynth-models = { path = "crates/models" }
desynth-server = { path = "crates/server" }

anyhow = "1"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
font8x8 = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
indexmap = { version = "2", features = ["serde"] }
mime_guess = "2"
lcms2 = { version = "6.2", features = ["static"] }
parking_lot = "0.12"
percent-encoding = "2"
png = "0.18"
rand = "0.9"
same-file = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiff = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
zune-core = "0.5"
zune-jpeg = "0.5"

futures-util = "0.3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
